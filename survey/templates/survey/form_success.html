<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks — {{ form_obj.title }}</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8; margin: 0; padding: 4rem 1rem; color: #1f2937;
    text-align: center;
  }
  .container {
    max-width: 480px; margin: 0 auto; background: #fff;
    padding: 2.5rem 2rem; border-radius: 12px;

  .check {
    width: 64px; height: 64px; line-height: 64px;
    margin: 0 auto 1rem; background: #10b981; color: #fff;
    border-radius: 50%; font-size: 2rem;
  }
  h1 { margin: .5rem 0; }
  p { color: #6b7280; }
</style>
</head>
<body>
  <div class="container">
    <div class="check">&#10003;</div>
    <h1>Thank you!</h1>
    <p>Your answer to <strong>{{ form_obj.title }}</strong> has been submitted.</p>
  </div>

</html>
